<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>EcoMart - Feedback</title>
    <style>
        /* Form container */
        .form {
            display: flex;
            flex-wrap: wrap;
            gap: 20px;
        }

        .inputwrap {
            position: relative;
            flex: 1 1 calc(50% - 10px);
            min-width: 250px;
        }

        /* Full width fields */
        .full,
        .gender-wrap {
            flex: 1 1 100%;
        }

        /* Inputs and textarea */
        .contact-input {
            width: 100%;
            padding: 18px 45px 18px 20px;
            border-radius: 20px;
            border: none;
            background-color: #eef2f6;
            font-size: 16px;
            outline: none;
        }

        textarea.contact-input {
            min-height: 140px;
            resize: none;
        }

        /* Icons */
        .inputwrap img {
            position: absolute;
            right: 18px;
            top: 50%;
            transform: translateY(-50%);
            opacity: 0.6;
        }

        /* Floating labels */
        .inputwrap label {
            position: absolute;
            left: 20px;
            top: 50%;
            transform: translateY(-50%);
            font-size: 14px;
            color: #8a8a8a;
            pointer-events: none;
            transition: 0.3s ease;
        }

        .contact-input:focus+label,
        textarea.contact-input:focus+label,
        select.contact-input:focus+label,
        .contact-input.filled+label,
        textarea.contact-input.filled+label,
        select.contact-input.filled+label {
            top: 15px;
            transform: translateY(-50%);
            font-size: 12px;
            color: #6b7280;
            background-color: transparent;
            padding: 0 4px;
        }

        /* Gender */
        .gender-wrap {
            background-color: #eef2f6;
            border-radius: 20px;
            padding: 16px 20px;
            display: flex;
            gap: 20px;
            align-items: center;
            font-size: 14px;
            color: #333;
        }

        .gender-wrap span {
            color: #6b7280;
        }

        /* Select */
        select.contact-input {
            appearance: none;
            cursor: pointer;
            padding-top: 18px;
            /* space for label float */
        }

        /* Button layout */
        .submit-button {
            display: flex;
            justify-content: center;
        }

        .container-button-group {
            display: flex;
            justify-content: space-between;
            align-items: center;
            width: 100%;
            margin-top: 20px;
        }

        /* Buttons */
        .submit {
            background-color: #31572c;
            color: #ecf39e;
            padding: 12px 24px;
            border: none;
            border-radius: 25px;
            cursor: pointer;
            font-size: 22px;
            transition: background-color 0.3s ease, transform 0.3s ease;
            margin-left: 25px;
        }

        .back {
            background-color: #31572c;
            color: #ecf39e;
            padding: 12px 24px;
            border: none;
            border-radius: 25px;
            cursor: pointer;
            font-size: 22px;
            transition: background-color 0.3s ease, transform 0.3s ease;
            margin-right: 25px;
        }

        .submit:hover,
        .back:hover {
            transform: scale(1.05);
            background-color: #90A955;
            color: #292712;
        }

        /* Form collective hover effect */
        .formcollective {
            transition: transform 0.4s ease, box-shadow 0.5s ease;
        }

        .formcollective:hover {
            transform: translateY(-5px);
            box-shadow: 20px 20px 40px rgba(0, 0, 0, 0.6);
        }

        .contactform,
        .feedbackform,
        .form {
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }

        .form:hover {
            transform: translateY(-3px);
        }

        /* Light theme overrides */
        .light-theme .invite {
            color: #123a13;
            text-decoration: underline;
        }

        .light-theme .formcollective {
            background-color: #8a8a8a;
            border: 3px solid #484b6a;
        }

        .light-theme .submit,
        .light-theme .back {
            background-color: rgba(119, 122, 146, 1);
            border: 3px solid #484b6a;
            color: #123a13;
        }

        .light-theme .submit:hover,
        .light-theme .back:hover {
            background-color: rgba(119, 122, 146, 0.4);
            color: #292712;
        }

        /* Error styling */
        .inputwrap .error-message {
            color: #dc2626;
            font-size: 12px;
            margin-top: 4px;
            display: none;
        }

        .inputwrap.error .error-message {
            display: block;
        }

        .inputwrap.error .contact-input {
            border: 2px solid #dc2626;
            background-color: #fee2e2;
        }

        .inputwrap.error label {
            color: #dc2626;
        }

        /* Shake animation */
        @keyframes shake {

            0%,
            100% {
                transform: translateX(0);
            }

            20%,
            60% {
                transform: translateX(-5px);
            }

            40%,
            80% {
                transform: translateX(5px);
            }
        }

        .inputwrap.error.shake {
            animation: shake 0.3s ease;
        }
    </style>
    <!-- script to design the label -->
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const inputs = document.querySelectorAll('.contact-input');

            inputs.forEach(input => {
                // On page load, check if input already has content
                if (input.value.trim() !== '') {
                    input.classList.add('filled');
                }

                // Listen for input changes
                input.addEventListener('input', () => {
                    if (input.value.trim() !== '') {
                        input.classList.add('filled');
                    } else {
                        input.classList.remove('filled');
                    }
                });
            });
        });
    </script>
    <script src="../Code/feedbackValidation.js"></script>

</head>

<body>
    <header>
        <h1 class="logo">EcoMart</h1>

        <nav class="navbar">
            <div class="container">
                <ul class="menu">
                    <li><a href="../index.html">Home</a></li>
                    <li><a href="../Code/about.html">About Us</a></li>
                    <li><a href="../Code/products.html">Products</a></li>
                    <li><a href="../Code/blog.html">Blog</a></li>
                    <li><a href="../Code/research.html">Research</a></li>
                    <li><a href="../Code/contact.html" class="active">Contact Us</a></li>
                </ul>

                <div class="theme-toggle" id="theme-toggle">
                    <img src="../Assets/Images/sun-solid-full.svg" alt="Sun icon for light mode" class="sun-icon">
                    <img src="../Assets/Images/moon-solid-full.svg" alt="Moon icon for dark mode" class="moon-icon">
                </div>
            </div>
        </nav>
    </header>

    <script src="../Code/night-day.js"></script>

    <main>
        <!-- Inline CSS Used Below -->
        <h1 class="invite" style="text-decoration: underline;">
            Give Us Your Feedback
        </h1>
        <form class="fbackForm">
            <div class="formcollective">
                <div class="mailimage">
                    <img src="../Assets/Images/user-square-svgrepo-com.svg" alt="Feedback Image" height="400">
                </div>

                <div class="form">
                    <!-- First Name -->
                    <div class="inputwrap">
                        <input type="text" class="contact-input">
                        <label>First Name</label>
                        <img src="../Assets/Images/address-card-solid-full.svg" height="20">
                    </div>

                    <!-- Last Name -->
                    <div class="inputwrap">
                        <input type="text" class="contact-input">
                        <label>Last Name</label>
                        <img src="../Assets/Images/address-card-solid-full.svg" height="20">
                    </div>

                    <!-- Email -->
                    <div class="inputwrap full">
                        <input type="email" class="contact-input">
                        <label>E-Mail</label>
                        <img src="../Assets/Images/envelope-solid-full.svg" height="20">
                    </div>

                    <!-- Phone -->
                    <div class="inputwrap full">
                        <input type="tel" class="contact-input">
                        <label>Phone Number</label>
                        <img src="../Assets/Images/phone-solid-full.svg" height="20">
                    </div>

                    <!-- Title -->
                    <div class="inputwrap full">
                        <input type="title" class="contact-input">
                        <label>Title</label>
                        <img src="../Assets/Images/message-solid-full.svg" height="20">
                    </div>

                    <!-- Message -->
                    <div class="inputwrap full">
                        <textarea class="contact-input"></textarea>
                        <label>Message</label>
                        <img src="../Assets/Images/message-solid-full.svg" height="20">
                    </div>

                    <div class="container-button-group">
                        <div class="submit-button">
                            <button class="submit" type="submit">Submit</button>
                        </div>
                        <div class="back-button">
                            <a href="../Code/contact.html">
                                <button class="back" type="button">Go Back</button>
                            </a>
                        </div>
                    </div>
                </div>
            </div>
        </form>
    </main>

    <footer>
        <p>&copy; 2026 EcoMart. All rights reserved. | Committed to Sustainable Living</p>
    </footer>
</body>

</html>
