<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>EcoMart - Talk To Us</title>
    <style>
        .form {
            display: flex;
            flex-wrap: wrap;
            gap: 20px;
        }

        .inputwrap {
            position: relative;
            flex: 0 0 calc(50% - 10px);
        }

        /* Full width fields */
        /* this is what affects the form */
        /* flex: vaneko
            initial: dont take excess space
            middle do not shrink
            rest affects the reamining part of the form */
        .full,
        .gender-wrap,
        .container-button-group {
            flex: 0 0 100%;
        }

        /* Inputs */
        .contact-input {
            width: 100%;
            padding: 18px 45px 18px 20px;
            border-radius: 20px;
            border: none;
            background-color: #eef2f6;
            font-size: 16px;
            outline: none;
        }

        /* Textarea */
        textarea.contact-input {
            min-height: 140px;
            resize: none;
        }

        /* Icons */
        .inputwrap img {
            position: absolute;
            right: 18px;
            top: 50%;
            transform: translateY(-50%);
            opacity: 0.6;
        }

        /* Floating labels */
        .inputwrap label {
            position: absolute;
            left: 20px;
            top: 50%;
            transform: translateY(-50%);
            font-size: 14px;
            color: #8a8a8a;
            pointer-events: none;
            transition: 0.3s ease;
        }

        /* Gender */
        .gender-wrap {
            display: flex;
            gap: 20px;
            align-items: center;
            padding: 16px 20px;
            border-radius: 20px;
            background-color: #eef2f6;
            font-size: 14px;
            color: #333;
            position: relative;
            /* needed for error-message positioning */
        }

        .gender-wrap span {
            color: #6b7280;
        }

        .gender-wrap.error {
            border: 2px solid #dc2626;
            background-color: #fee2e2;
        }

        .gender-wrap .gender-label {
            display: flex;
            align-items: center;
            gap: 5px;
            cursor: pointer;
        }

        .gender-wrap .error-message {
            position: absolute;
            bottom: -18px;
            left: 0;
            font-size: 12px;
            color: #dc2626;
            display: none;
        }

        .gender-wrap.error .error-message {
            display: block;
        }

        /* Select fix */
        select.contact-input {
            appearance: none;
            cursor: pointer;
            /* Changes cursor's design */
        }

        /* Floating labels for inputs, textarea, and select */
        .contact-input:focus+label,
        textarea.contact-input:focus+label,
        .contact-input.filled+label,
        textarea.contact-input.filled+label,
        select.contact-input.filled+label {
            top: 15px;
            transform: translateY(-50%);
            font-size: 12px;
            color: #6b7280;
            background-color: transparent;
            padding: 0 4px;
        }


        /* Specific fix for the Subject Select Icon (Optional) */
        select.contact-input {
            padding-top: 18px;
            /* Adds space for the label to float into */
        }

        /* Center the wrapper across both grid columns */
        .submit-button {
            display: flex;
            justify-content: center;
        }

        .container-button-group {
            flex: 0 0 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 150px;
        }

        .submit {
            background-color: #31572c;
            color: #ecf39e;
            padding: 12px 24px;
            border: none;
            border-radius: 25px;
            cursor: pointer;
            font-size: 22px;
            transition: background-color 0.3s ease;
        }

        .submit:hover {
            background-color: #90A955;
            color: #292712;
        }

        .back {
            background-color: #31572c;
            color: #ecf39e;
            padding: 12px 24px;
            border: none;
            border-radius: 25px;
            cursor: pointer;
            font-size: 22px;
            transition: background-color 0.3s ease;
        }

        .back-button {
            display: flex;
        }

        .formcollective {
            transition: transform 0.4s ease, box-shadow 0.5s ease;
        }

        .formcollective:hover {
            transform: translateY(-5px);
            /* Same lift as product cards */
            box-shadow: 20px 20px 40px rgba(0, 0, 0, 0.6);
            /* Deeper shadow on hover */
        }

        .contactform,
        .feedbackform,
        .form {
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }

        .submit:hover,
        .back:hover {
            transform: scale(1.05);
            /* Slight grow effect to match the 'active' feel */
            transition: 0.3s ease;
            background-color: #90A955;
            color: #292712;
        }

        /* Error message styling */
        .inputwrap .error-message {
            color: #dc2626;
            /* Red for errors */
            font-size: 12px;
            margin-top: 4px;
            display: none;
            /* Hidden by default */
        }

        /* Show error message */
        .inputwrap.error .error-message {
            display: block;
        }

        /* Highlight input on error */
        .inputwrap.error .contact-input {
            border: 2px solid #dc2626;
            background-color: #fee2e2;
            /* light red background */
        }

        /* Floating label adjustment when input has error */
        .inputwrap.error label {
            color: #dc2626;
        }

        /* Optional: smooth shake animation for error */
        @keyframes shake {

            0%,
            100% {
                transform: translateX(0);
            }

            20%,
            60% {
                transform: translateX(-5px);
            }

            40%,
            80% {
                transform: translateX(5px);
            }
        }

        .inputwrap.error.shake {
            animation: shake 0.3s ease;
        }

        .light-theme {
            .invite {
                color: #123a13;
                text-decoration: underline;
            }

            .formcollective {
                background-color: #8a8a8a;
                border: 3px solid #484b6a;
            }

            .submit {
                background-color: rgba(119, 122, 146, 1);
                border: 3px solid #484b6a;
                color: #123a13;
            }

            .back {
                background-color: rgba(119, 122, 146, 1);
                color: #123a13;
                padding: 12px 24px;
                border: 3px solid #484b6a;
                border-radius: 25px;
                cursor: pointer;
                font-size: 22px;
                transition: background-color 0.3s ease;
            }

            .submit:hover,
            .back:hover {
                background-color: rgba(119, 122, 146, 0.4);
                color: #292712;
            }
        }
    </style>
    <script src="../Code/talkToTeamValidation.js"></script>
</head>

<body>
    <header>
        <h1 class="logo">EcoMart</h1>

        <nav class="navbar">
            <div class="container">
                <ul class="menu">
                    <li><a href="../index.html">Home</a></li>
                    <li><a href="../Code/about.html">About Us</a></li>
                    <li><a href="../Code/products.html">Products</a></li>
                    <li><a href="../Code/blog.html">Blog</a></li>
                    <li><a href="../Code/research.html">Research</a></li>
                    <li><a href="../Code/contact.html" class="active">Contact Us</a></li>
                </ul>

                <div class="theme-toggle" id="theme-toggle">
                    <img src="../Assets/Images/sun-solid-full.svg" alt="Sun icon for light mode" class="sun-icon">
                    <img src="../Assets/Images/moon-solid-full.svg" alt="Moon icon for dark mode" class="moon-icon">
                </div>
            </div>
        </nav>
    </header>

    <script src="../Code/night-day.js"></script>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const inputs = document.querySelectorAll('.contact-input');

            inputs.forEach(input => {
                // Check initially if the input has a value
                if (input.value.trim() !== '') {
                    input.classList.add('filled');
                }

                // Add/remove 'filled' class on input
                input.addEventListener('input', () => {
                    if (input.value.trim() !== '') {
                        input.classList.add('filled');
                    } else {
                        input.classList.remove('filled');
                    }
                });
            });
        });
    </script>

    <main>
        <!-- Inline CSS Used Below -->
        <h1 class="invite">
            Talk To Our Team
        </h1>
        <div class="formcollective">
            <div class="mailimage">
                <img src="../Assets/Images/mail-send-svgrepo-com.svg" alt="Mail Image" height="400">
            </div>
            <form id="contactform">
                <div class="form">
                    <!-- First Name -->
                    <div class="inputwrap">
                        <input type="text" class="contact-input" id="fname">
                        <label>First Name</label>
                        <img src="../Assets/Images/address-card-solid-full.svg" height="20">
                    </div>

                    <!-- Last Name -->
                    <div class="inputwrap">
                        <input type="text" class="contact-input" id="lname">
                        <label>Last Name</label>
                        <img src="../Assets/Images/address-card-solid-full.svg" height="20">
                    </div>

                    <!-- Email -->
                    <div class="inputwrap full">
                        <input type="email" class="contact-input">
                        <label>E-Mail</label>
                        <img src="../Assets/Images/envelope-solid-full.svg" height="20">
                    </div>

                    <!-- Phone -->
                    <div class="inputwrap full">
                        <input type="tel" class="contact-input" id="tel">
                        <label>Phone Number</label>
                        <img src="../Assets/Images/phone-solid-full.svg" height="20">
                    </div>

                    <!-- Gender -->
                    <div class="gender-wrap">
                        <span>Gender</span>
                        <label><input type="radio" name="gender" id="male"> Male</label>
                        <label><input type="radio" name="gender" id="female"> Female</label>
                        <label><input type="radio" name="gender" id="other"> Other</label>
                    </div>

                    <!-- Subject -->
                    <div class="inputwrap full">
                        <select class="contact-input" id="selection">
                            <option value="select" disabled selected>-- Please select the subject here --</option>
                            <option value="product">Product Inquiry</option>
                            <option value="support">Support</option>
                            <option value="partnership">Partnership</option>
                            <option value="other">Other</option>
                        </select>
                    </div>

                    <!-- Message -->
                    <div class="inputwrap full">
                        <textarea class="contact-input" id="message"></textarea>
                        <label>Message</label>
                        <img src="../Assets/Images/message-solid-full.svg" height="20">
                    </div>

                    <div class="container-button-group">
                        <div class="submit-button">
                            <button class="submit" type="submit">Submit</button>
                        </div>
                        <div class="back-button">
                            <a href="../Code/contact.html">
                                <button class="back" type="button">Go Back</button>
                            </a>
                        </div>
                    </div>
                </div>
            </form>
        </div>
    </main>

    <footer>
        <p>&copy; 2026 EcoMart. All rights reserved. | Committed to Sustainable Living</p>
    </footer>
</body>

</html>
